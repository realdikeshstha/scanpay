{{> _header.html}}
<section class="card narrow">
  <h1>Sign in</h1>
  {{#error}}<p class="alert" role="alert">{{error}}</p>{{/error}}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{login_csrf}}">
    <label>Phone number
      <input name="phone" type="tel" inputmode="tel" maxlength="20" placeholder="+1 555 555 0101"
             value="{{phone}}" autocomplete="username" required>
    </label>
    <label>Password
      <input name="password" type="password" maxlength="128" autocomplete="current-password" required>
    </label>
    <button type="submit">Sign in</button>
  </form>
  <p class="muted small">Demo accounts are listed in the README. Five wrong passwords lock an account for 15 minutes.</p>
</section>
{{> _footer.html}}
